info:
  name: Start experiment command by nickname
  type: http
  seq: 32
  tags:
    - manual

http:
  method: POST
  url: "{{baseUrl}}/exps/:id/start/:nickname"
  params:
    - name: id
      value: "{{experimentId}}"
      type: path
    - name: nickname
      value: "{{execNickname}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Intended to start one named command. Current server wiring calls StartExperimentHandler and ignores nickname; use with caution until the route is fixed.
