info:
  name: Start experiment
  type: http
  seq: 31
  tags:
    - manual

http:
  method: POST
  url: "{{baseUrl}}/exps/:id/start"
  params:
    - name: id
      value: "{{experimentId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Starts the registered experiment process. This executes commands from the experiment record.
