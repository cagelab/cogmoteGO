info:
  name: Get latest named broadcast data
  type: http
  seq: 10
  tags:
    - regression

http:
  method: GET
  url: "{{baseUrl}}/broadcast/data/:name/latest"
  params:
    - name: name
      value: "{{broadcastName}}"
      type: path

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns data or not found", () => expect([200, 404]).to.include(res.status));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the latest payload for a named broadcast endpoint.
