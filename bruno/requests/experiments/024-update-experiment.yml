info:
  name: Update experiment
  type: http
  seq: 24
  tags:
    - manual

http:
  method: PUT
  url: "{{baseUrl}}/exps/:id"
  params:
    - name: id
      value: "{{experimentId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nickname": "bruno-local-experiment",
        "type": "local",
        "address": null,
        "data_path": null,
        "execs": [
          {
            "nickname": "default",
            "exec": "echo updated"
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Replaces the experiment metadata for experimentId.
