info:
  name: Add email recipient
  type: http
  seq: 46
  tags:
    - manual

http:
  method: POST
  url: "{{baseUrl}}/email/recipients"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "bruno@example.test"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Adds a recipient and persists the configuration. Uses a synthetic example address.
